# Test bindings for every row of cause_effect.csv — authored and signed by the controls engineer.
# A binding says how to provoke the cause on the plant twin and how to observe the effect.
# scripts/build_data.py turns (C&E row + binding) into scenarios/ce_<station>.yaml.
stations:
  ST20:
    plant: st20
    preamble:
      - {at_ms: 0, set: {X0: true, X2: true}}
      - {at_ms: 100, set: {X23: true}}
      - {when: "M207", delay_ms: 500, set: {X23: false}}
  ST10:
    plant: st10
    preamble:
      - {at_ms: 0, set: {X0: true, X2: true}}
      - {at_ms: 0, plant: {spawn_pallet: {}}}
  ST30:
    plant: st30
    preamble:
      - {at_ms: 0, set: {X0: true, X32: true, X33: true}}
bindings:
  CE-ST20-01:
    duration_ms: 12000
    stimuli:
      - {when: "M202", delay_ms: 1500, plant: {inject: {fault: clamp_slip}}}
    expect:
      - {response: {trigger: "M202 and not X20", effect: "not Y21"}, within_ms: 20}
      - {never: "Y21 and not X20"}
  CE-ST20-02:
    duration_ms: 12000
    stimuli:
      - {when: "M203", delay_ms: 500, plant: {inject: {fault: regulator_fail, supply_kpa: 30}}}
      - {when: "M203", delay_ms: 500, plant: {inject: {fault: fill_valve_stuck_open}}}
    expect:
      - {response: {trigger: "P_kpa > 20.5", effect: "Y22 and not Y21"}, within_ms: 100}
      - {eventually: "M291 and M211", by_ms: 12000}
  CE-ST20-03:
    duration_ms: 3000
    stimuli:
      - {at_ms: 0, plant: {inject: {fault: pt_wire_break}}}
    expect:
      - {eventually: "M292 and Y25", by_ms: 50}
      - {never: "M201 or Y20 or Y21"}
  CE-ST20-04:
    duration_ms: 16000
    stimuli:
      - {when: "M204", delay_ms: 2000, set: {X0: false}}
    expect:
      - {response: {trigger: "not X0 and M200", effect: "Y22 and not Y21"}, within_ms: 50}
      - {eventually: "M211", by_ms: 16000}
      - {never: "M210"}
  CE-ST20-05:
    duration_ms: 12000
    plant: {supply_kpa: 13.0}
    expect:
      - {eventually: "M290 and M211 and Y22", by_ms: 9300}
      - {never: "M203"}
  CE-ST20-06:
    duration_ms: 30000
    plant: {leak_kpa_per_s: 0.08}
    expect:
      - {eventually: "Y24 and M211", by_ms: 28000}
      - {never: "Y23 or M210"}
  CE-ST20-07:
    duration_ms: 30000
    plant: {leak_kpa_per_s: 0.005}
    expect:
      - {eventually: "Y23 and M210", by_ms: 28000}
      - {never: "Y24 or M211"}
  CE-ST20-08:
    duration_ms: 30000
    plant: {leak_kpa_per_s: 0.005}
    expect:
      - {never: "not Y20 and P_kpa > 1.0"}
      - {eventually: "M207", by_ms: 28000}
  CE-ST20-09:
    duration_ms: 16000
    stimuli:
      - {when: "M204", delay_ms: 1000, plant: {inject: {fault: supply_air_low}}}
    expect:
      - {response: {trigger: "not X22 and M200", effect: "Y22 and not Y21"}, within_ms: 50}
      - {eventually: "M293 and M211", by_ms: 16000}
  CE-ST10-01:
    duration_ms: 4000
    stimuli:
      - {when: "Y10", delay_ms: 1000, set: {X0: false}}
    expect:
      - {response: {trigger: "not X0", effect: "not Y10"}, within_ms: 20}
  CE-ST10-02:
    duration_ms: 4000
    stimuli:
      - {when: "Y10", delay_ms: 1000, plant: {inject: {fault: overload}}}
    expect:
      - {response: {trigger: "not X13", effect: "not Y10"}, within_ms: 20}
  CE-ST10-03:
    duration_ms: 8000
    stimuli:
      - {at_ms: 1000, plant: {inject: {fault: jam_at_entry}}}
    expect:
      - {eventually: "M190 and not Y10", by_ms: 6600}
  CE-ST30-01:
    duration_ms: 4000
    stimuli:
      - {when: "Y30", delay_ms: 1000, set: {X32: false}}
    expect:
      - {response: {trigger: "not X32", effect: "not Y30 and not Y31"}, within_ms: 20}
      - {never: "M310"}
  CE-ST30-02:
    duration_ms: 4000
    stimuli:
      - {when: "Y30", delay_ms: 1000, set: {X0: false}}
    expect:
      - {response: {trigger: "not X0", effect: "not Y30 and not Y31"}, within_ms: 20}
