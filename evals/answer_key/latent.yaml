# SEALED. Issues found by reviewers beyond the seeded defects, adjudicated on the simulator
# (evals/answer_key/latent_scenarios.yaml). confirmed = scenario fails on the reference AND a narrative or standard
# requirement backs it. A finding matches only if it names a device from every `require` group ("~word" = the word appears in its title or evidence). debatable = scenario fails but no stated requirement (neither credited nor penalised).
L1:
  station: ST20
  status: confirmed
  title: Holding fault reset masks active faults (reset rung runs after the set rungs)
  scenario: LAT-ST20-L1
  match: {require: [[X1]], categories: [semantic_logic, safety, missing_interlock, timing, other]}
L2:
